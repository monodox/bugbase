name: Manual Checks

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Manual task to run"
        required: true
        default: "repo-summary"
        type: choice
        options:
          - repo-summary
          - test

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.task == 'test'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: inputs.task == 'test'
        run: npm install

      - name: Run tests
        if: inputs.task == 'test'
        run: npm test

      - name: Print repository summary
        if: inputs.task == 'repo-summary'
        run: |
          echo "Repository: bugbase"
          echo "Packages:"
          echo "- @monodox/bugbase"
          echo "- @monodox/bugbase-mcp-server"

