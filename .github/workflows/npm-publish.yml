name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace package to publish"
        required: true
        default: "node"
        type: choice
        options:
          - node
          - mcp-server
          - python

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Publish CLI package
        if: inputs.package == 'node'
        run: npm publish --workspace @monodox/bugbase --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish MCP server package
        if: inputs.package == 'mcp-server'
        run: npm publish --workspace @monodox/bugbase-mcp-server --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Python
        if: inputs.package == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        if: inputs.package == 'python'
        run: pip install build twine

      - name: Build Python package
        if: inputs.package == 'python'
        run: python -m build
        working-directory: packages/python

      - name: Publish Python package
        if: inputs.package == 'python'
        run: twine upload dist/*
        working-directory: packages/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
