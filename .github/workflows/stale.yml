name: Mark Stale Issues And PRs

on:
  schedule:
    - cron: "40 17 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Mark stale items
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been inactive for a while. If it is still relevant, add an update so it stays open."
          stale-pr-message: "This pull request has been inactive for a while. Add an update or push changes if work is still active."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "security,planned"
          exempt-pr-labels: "security,work-in-progress"

