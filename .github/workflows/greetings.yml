name: Greetings

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in Bugbase.
            Please include reproduction steps, expected behavior, and environment details where possible.
          pr-message: |
            Thanks for opening your first pull request in Bugbase.
            Please keep the change focused and make sure docs stay in sync with behavior changes.

